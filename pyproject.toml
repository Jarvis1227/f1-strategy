[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strategy"
version = "0.1.0"
description = "A reproducible, lap-based race strategy simulator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium>=1.0,<2", "numpy>=1.26,<3"]
calibration = ["fastf1>=3.6,<4", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
f1-strategy = "f1_strategy.cli:main"

[tool.setuptools.packages.find]
include = ["f1_strategy*"]

[tool.setuptools.package-data]
f1_strategy = ["default_config.json", "podium_scenario.json"]
